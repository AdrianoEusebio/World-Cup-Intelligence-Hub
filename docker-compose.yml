services:
  db:
    image: postgres:15-alpine
    container_name: worldcup_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: worldcup_app
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app 
    env_file:
      - .env
    environment:
      - DB_HOST=db

volumes:
  postgres_data:
